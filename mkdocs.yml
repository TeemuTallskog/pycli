site_name: pycli
site_description: Pure-Python building blocks for interactive command-line tools
site_url: https://teemutallskog.github.io/pycli/
repo_url: https://github.com/TeemuTallskog/pycli
repo_name: TeemuTallskog/pycli
edit_uri: edit/main/docs/
docs_dir: docs
strict: true

theme:
  name: material
  features:
    - content.action.edit
    - content.action.view
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            filters: ["!^_"]
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_root_full_path: false
            show_root_heading: true
            show_signature_annotations: true
            show_source: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true

nav:
  - Home: index.md
  - Guides:
      - Prompts: guides/prompts.md
      - Terminal: guides/terminal.md
      - Custom widgets: guides/custom-widgets.md
      - Errors: guides/errors.md
  - API reference:
      - Overview: api/index.md
      - pycli: api/pycli.md
      - pycli.term: api/term.md
      - pycli.term.ansi: api/ansi.md
      - pycli.input: api/input.md
      - pycli.render: api/render.md
      - pycli.widgets: api/widgets.md
      - pycli.style: api/style.md
      - pycli.app: api/app.md
